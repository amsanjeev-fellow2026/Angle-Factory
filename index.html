<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Factory</title>
<style>
:root{--bg:#e9eef4;--pn:#fff;--ink:#12263f;--mut:#51657d;--nav:#12263f;--yel:#ffc533;--org:#e8590c;--tea:#0b7f74;--ok:#14733a;--bad:#a4281c;--ln:#c5d0dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a2b;--pn:#16283f;--ink:#eef3f9;--mut:#a9bad0;--ln:#2d4560;--ok:#5fd68a;--bad:#ff8c80}}
:root[data-theme=dark]{--bg:#0d1a2b;--pn:#16283f;--ink:#eef3f9;--mut:#a9bad0;--ln:#2d4560;--ok:#5fd68a;--bad:#ff8c80}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:clamp(15px,2.3vh,20px)/1.3 "Trebuchet MS","Segoe UI",Verdana,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--pn);border-radius:12px;min-height:44px;padding:4px 14px;font-weight:700}
button:hover{background:var(--yel);color:#12263f}button.pri:hover{background:#fff;color:#12263f}.ic{flex:none;filter:drop-shadow(0 0 1.2px #12263f) drop-shadow(0 0 1.2px #12263f)}.hud span,#hs{display:inline-flex;align-items:center;gap:5px}#hs{flex-wrap:wrap}.card .ic{width:clamp(36px,7vh,60px);height:auto}.big{display:flex;justify-content:center;gap:6px}.big .ic{width:clamp(40px,10vh,90px);height:auto}.stars .ic{width:clamp(30px,6vh,56px)}.stat b{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
button.pri{background:var(--yel);color:#12263f;box-shadow:0 4px 0 var(--ink)}
:focus-visible{outline:4px solid var(--org);outline-offset:2px}
.hud{flex:none;background:var(--nav);color:#fff;display:flex;gap:12px;align-items:center;padding:6px 12px;flex-wrap:wrap}
.hud b{font-size:1.2em}.sp{flex:1}.hud button{min-height:36px;background:transparent;color:#fff;border-color:#fff}.hud button:hover{color:#12263f}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px 10px;gap:8px}
.ft{flex:none;text-align:center;font-size:12px;color:var(--mut);padding:3px 8px}
.stage{flex:1 0 260px;position:relative;background:#0b1530;border-radius:16px;border:3px solid var(--ink);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#q{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--pn);border:3px solid var(--yel);border-radius:14px;padding:4px 18px;font-size:clamp(18px,4vh,34px);font-weight:800;text-align:center;max-width:94%;z-index:2}
#tm{position:absolute;left:0;right:0;top:0;height:8px;background:#fff3;z-index:3}#tm i{display:block;height:100%;width:100%;background:var(--yel)}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 20px;border-radius:12px;font-weight:800;font-size:clamp(17px,3.4vh,28px);text-align:center;z-index:4;max-width:94%;display:none;color:#fff}
#toast.ok{display:flex;gap:8px;align-items:center;background:#14733a}#toast.no{display:flex;gap:8px;align-items:center;background:#a4281c}
#grid{position:absolute;inset:0;display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:68px 10px 10px}
.s-spot #grid{display:grid}.s-spot #cv{display:none}
.shp{background:#13264a;border:3px solid #2c4470;border-radius:16px;padding:4px;min-height:0;color:#fff}.shp svg{width:100%;height:100%}.shp:hover{background:#25508f;border-color:#ffc533}
.shp.good{border-color:#4be08a;background:#134d33}.shp.x{opacity:.4}
.dock{flex:none;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.dock button{min-height:clamp(46px,8vh,70px);min-width:clamp(60px,8vw,100px);font-size:clamp(18px,3vh,28px)}
.rd{font-size:clamp(28px,6vh,52px);font-weight:800;min-width:3.2ch;text-align:center}
.fire{padding:4px 28px!important;display:inline-flex;align-items:center;gap:8px}
.hm{align-items:center;justify-content:center;text-align:center}
.hm h1{font-size:clamp(30px,7vh,68px);margin:4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;width:min(1100px,100%);margin:12px 0}
.card{display:flex;flex-direction:column;gap:4px;padding:14px;min-height:clamp(130px,22vh,210px);justify-content:center}.card span{font-size:clamp(32px,6vh,56px)}.card small{font-weight:400;color:var(--mut)}.card:hover small{color:#12263f}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 24px;font-size:1.3em;margin:10px 0;text-align:left}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov>div{background:var(--pn);border-radius:14px;padding:20px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.ov label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.ov select{padding:6px;background:var(--pn);color:var(--ink)}.ov input{width:26px;height:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cf{color:#ffc533;position:absolute;top:100%;font-style:normal;font-size:28px;pointer-events:none;z-index:5}
@media(prefers-reduced-motion:no-preference){.cf{animation:up 1.3s ease-out forwards}@keyframes up{to{transform:translateY(-90vh) rotate(360deg);opacity:0}}}
@media(max-width:600px){.dock button{min-width:52px;padding:4px 8px}}
</style></head><body><div id="app"></div><div id="tp"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),Rn=a=>a[R(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]),sl=ms=>new Promise(r=>setTimeout(r,ms));

const FT='<div class="ft">© 2026 Angle Factory | Developed by AMSanjeev (Teach For India Fellow 2026–28)</div>';
const IC={
gear:'<path fill="currentColor" fill-rule="evenodd" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1c.5.4 1.100.7 1.700 1L11 21h4l.3-2.700c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.400zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" transform="translate(-1 0)"/>',

mirror:'<rect x="3" y="3" width="18" height="4" rx="1" fill="#8fd3ff"/><path d="M4 21L12 7l8 14" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/>',

search:'<circle cx="10" cy="10" r="6.500" fill="none" stroke="currentColor" stroke-width="2.500"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',

starO:'<path d="M12 2l3 6.500 7 .9-5.200 4.800 1.400 7L12 17.800 5.800 21.200l1.400-7L2 9.400l7-.9z" fill="none" stroke="#9fb3d1" stroke-width="1.500"/>',
heart:'<path d="M12 21S4 15.800 4 10a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.800-8 11-8 11z" fill="#ff4d5e"/>',
heartO:'<path d="M12 21S4 15.800 4 10a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.800-8 11-8 11z" fill="none" stroke="#7d8fae" stroke-width="1.800"/>',
flame:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff7a2f"/><path d="M12 22a3 3 0 0 1-3-3c0-2 2-3 3-5 1 2 3 3 3 5a3 3 0 0 1-3 3z" fill="#ffc533"/>',
trophy:'<path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="#ffc533"/><path d="M7 5H3c0 4 2 6 4 6M17 5h4c0 4-2 6-4 6" fill="none" stroke="#ffc533" stroke-width="2"/><rect x="10.500" y="14" width="3" height="4" fill="#ffc533"/><rect x="7" y="18" width="10" height="3" rx="1" fill="#ffc533"/>',
medal:'<path d="M7 2l5 8 5-8" fill="none" stroke="#ff4d5e" stroke-width="3"/><circle cx="12" cy="15" r="6.500" fill="#ffc533" stroke="#b8860b" stroke-width="1.500"/><path d="M12 11.500l1.200 2.500 2.800.3-2.100 1.900.6 2.700-2.500-1.400-2.500 1.400.6-2.700-2.100-1.900 2.800-.3z" fill="#b8860b"/>',
burst:'<path d="M12 1l2.500 6.500L21 4l-3 6.500L23 12l-5.500 1.500L21 20l-6.500-3.500L12 23l-2.500-6.500L3 20l3.500-6.500L1 12l5.500-1.500L3 4l6.500 3.500z" fill="#ff7a2f"/><circle cx="12" cy="12" r="4" fill="#ffc533"/>',
robot:'<rect x="5" y="8" width="14" height="11" rx="3" fill="#9fb8d9" stroke="#e8f0ff" stroke-width="1.500"/><rect x="11" y="3" width="2" height="5" fill="#e8f0ff"/><circle cx="12" cy="3" r="1.800" fill="#ff4d5e"/><circle cx="9" cy="13" r="2.200" fill="#0b1530"/><circle cx="15" cy="13" r="2.200" fill="#0b1530"/><circle cx="9" cy="13" r=".8" fill="#4be08a"/><circle cx="15" cy="13" r=".8" fill="#4be08a"/><rect x="9" y="16.500" width="6" height="1.500" rx=".7" fill="#0b1530"/><rect x="2.500" y="11" width="2.500" height="5" rx="1" fill="#e8f0ff"/><rect x="19" y="11" width="2.500" height="5" rx="1" fill="#e8f0ff"/>',
check:'<circle cx="12" cy="12" r="10" fill="#4be08a"/><path d="M7 12.500l3.200 3.200L17 9" fill="none" stroke="#0b1530" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"/>',
cross:'<circle cx="12" cy="12" r="10" fill="#ff6b5e"/><path d="M8 8l8 8M16 8l-8 8" stroke="#0b1530" stroke-width="2.800" stroke-linecap="round"/>',
eyeoff:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"/>',
spark:'<path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z" fill="#ffc533"/>'};
const I=(n,z=24,x='')=>`<svg class="ic" viewBox="0 0 24 24" width="${z}" height="${z}" ${x} aria-hidden="true" style="vertical-align:middle">${IC[n]}</svg>`;
const MODES={laser:{n:'Laser Shot',ic:'target',d:'Aim the cannon and blast the right robot!'},bounce:{n:'Bounce Shot',ic:'mirror',d:'Bank the laser off the mirror into the robot'},fix:{n:'Quick Fix',ic:'wrench',d:'Beat the clock: find the missing angle'},spot:{n:'Shape Spot',ic:'search',d:'Tap the right shape before time runs out'}};
const NAMES={point:'POINT',line:'LINE',segment:'LINE SEGMENT',ray:'RAY'},DESC={point:'marks just a location',line:'has no endpoints',segment:'has a start and an end',ray:'has exactly ONE endpoint'};
const P=(a,r)=>[S.cx+r*Math.cos(a*Math.PI/180),S.cy-r*Math.sin(a*Math.PI/180)],f=n=>Math.round(n*10)/10;
const T=(x,y,s,c='#e8f0ff',z=24)=>`<text x="${f(x)}" y="${f(y)}" font-size="${z}" font-weight="700" fill="${c}" text-anchor="middle">${s}</text>`;
const L=(p,q,c,w=6,d='')=>`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`;
const bot=(x,y,dead)=>I(dead?'burst':'robot',60,`x="${f(x-30)}" y="${f(y-30)}"`);
function home(){clearTimeout(S.tid);S={};$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} ANGLE FACTORY</b><span class="sp"></span><button onclick="tp(1)">${I('gear',18)} Teacher</button></div><main class="hm"><h1>ANGLE FACTORY</h1><div>Pick a game · 3 lives · 10 rounds · beat your best!</div><div class="cards">${Object.keys(MODES).map(k=>`<button class="card" onclick="start('${k}')"><span>${I(MODES[k].ic,56)}</span><b>${MODES[k].n}</b><small>${MODES[k].d}</small><em>${B[k]?I('trophy',20)+' Best '+B[k]:I('spark',20)+' New'}</em></button>`).join('')}</div></main>${FT}`}
function start(m){S={m,r:0,score:0,lives:3,streak:0,mx:0,ok:0};$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} ANGLE FACTORY</b><span>${I(MODES[m].ic,20)} ${MODES[m].n}</span><span class="sp"></span><span id="hs"></span><button onclick="home()">Menu</button></div><main><div class="stage s-${m}"><svg id="cv" viewBox="0 0 800 460"><g id="g"></g></svg><div id="grid"></div><div id="q"></div><div id="tm"><i></i></div><div id="toast"></div></div><div class="dock" id="dock"></div></main>${FT}`;nextRound()}
function hud(){$('#hs').innerHTML=`Round ${Math.min(S.r,10)}/10 · ${I('star',18)} ${S.score} · ${I('heart',18).repeat(S.lives)}${I('heartO',18).repeat(3-S.lives)} · ${I('flame',18)} ${S.streak}`}
function nextRound(){if(S.lives<=0||S.r>=10)return end();S.r++;S.busy=false;S.rg=0;S.shot=null;S.rev=0;$('#toast').className='';$('#tm').style.display='none';hud();({laser:rLaser,bounce:rBounce,fix:rFix,spot:rSpot})[S.m]()}
function tmr(sec,fn){$('#tm').style.display='block';const i=$('#tm i');i.style.transition='none';i.style.width='100%';i.offsetWidth;i.style.transition=`width ${sec}s linear`;i.style.width='0';S.t0=Date.now();S.tl=sec;S.tid=setTimeout(()=>{if(!S.busy)fn()},sec*1000)}
const spd=()=>Math.max(0,Math.round(5*(1-(Date.now()-S.t0)/1000/S.tl)));
function conf(){const s=$('.stage');for(let i=0;i<16;i++){const e=document.createElement('i');e.className='cf';e.innerHTML=I(['star','spark','wrench','gear'][i%4],30);e.style.cssText=`left:${R(5,92)}%;animation-delay:${i*40}ms`;s.appendChild(e);setTimeout(()=>e.remove(),1800)}}
async function done(ok,msg,bonus=0){S.busy=true;S.rev=1;clearTimeout(S.tid);let t=$('#toast');
 if(ok){S.streak++;S.mx=Math.max(S.mx,S.streak);S.ok++;const p=10+Math.min(S.streak-1,5)*2+bonus;S.score+=p;beep(660);setTimeout(()=>beep(880),90);conf();t.innerHTML=`${I('check',26)} ${msg} +${p}`;t.className='ok'}
 else{S.streak=0;S.lives--;beep(170,.3,'sawtooth');t.innerHTML=I('cross',26)+' '+msg;t.className='no'}
 if(S.m=='spot')document.querySelectorAll('.shp').forEach(b=>b.classList.add(b.dataset.t==S.tgt?'good':'x'));else draw();
 hud();await sl(ok?1400:2300);nextRound()}
function end(){const w=S.lives>0,st=w?S.lives:0;B[S.m]=Math.max(B[S.m]||0,S.score);sv();$('#app').innerHTML=`<div class="hud"><b>${I('gear',22)} ANGLE FACTORY</b><span>${I(MODES[S.m].ic,20)} ${MODES[S.m].n}</span></div><main class="hm"><div class="big">${I(w?'medal':'burst',90)}</div><h1>${w?'Machine fixed!':'Machine broke down!'}</h1><div class="big stars">${I('star',56).repeat(st)}${I('starO',56).repeat(3-st)}</div><div class="stat"><span>Score</span><b>${S.score}</b><span>Correct</span><b>${S.ok} / ${S.r}</b><span>Best streak</span><b>${I('flame',22)} ${S.mx}</b><span>Your best</span><b>${I('trophy',22)} ${B[S.m]}</b></div><div class="row"><button class="pri" onclick="start('${S.m}')">Play again</button><button onclick="home()">Choose another game</button></div></main>${FT}`}
/* ---------- aiming ---------- */
function dockAim(){$('#dock').innerHTML=`<button onclick="nud(-5)">−5°</button><button onclick="nud(-1)">−1°</button><div class="rd" id="rd"></div><button onclick="nud(1)">+1°</button><button onclick="nud(5)">+5°</button><button class="pri fire" onclick="fire()">${I('flame',26)} FIRE</button>`}
function setA(v,sn){if(S.busy||!S.rg)return;v=Math.max(S.rg[0],Math.min(S.rg[1],sn&&cfg.snap>1?Math.round(v/cfg.snap)*cfg.snap:Math.round(v)));S.a=v;draw()}
const nud=d=>setA(S.a+d,0);
function draw(){const h=({laser:dLaser,bounce:dBounce,fix:dFix})[S.m];if(!h)return;$('#g').innerHTML=h();const r=$('#rd');if(r)r.textContent=cfg.live&&!S.blind?S.a+'°':'??'}
function pt(e){const s=$('#cv'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());return[q.x,q.y]}
function mv(e){const[x,y]=pt(e);let a=Math.atan2(S.cy-y,x-S.cx)*180/Math.PI;if(a<0)a=(S.m=='laser'&&x<S.cx)?180:0;setA(a,1)}
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('#cv');if(!s||!S.rg||S.busy)return;dg=1;try{s.setPointerCapture(e.pointerId)}catch(x){}mv(e)});
document.addEventListener('pointermove',e=>{if(dg)mv(e)});document.addEventListener('pointerup',()=>dg=0);
document.addEventListener('keydown',e=>{if(!S.rg||S.busy)return;const d=e.shiftKey?5:1;if(e.key=='ArrowRight'||e.key=='ArrowUp'){nud(d);e.preventDefault()}if(e.key=='ArrowLeft'||e.key=='ArrowDown'){nud(-d);e.preventDefault()}if((e.key=='Enter'||e.key==' ')&&document.activeElement.tagName!='BUTTON'){fire();e.preventDefault()}});
function fire(){if(S.busy||!S.rg)return;S.busy=true;beep(300,.15,'square');S.blind=0;
 if(S.m=='laser'){const h=S.bots.filter(b=>Math.abs(b.a-S.a)<=cfg.tol).sort((x,y)=>Math.abs(x.a-S.a)-Math.abs(y.a-S.a))[0];S.shot={d:h?h.r-22:400};if(h)h.dead=1;const ok=h&&h===S.bots[0];if(!ok)S.bots[0].hl=1;S.busy=0;
  done(ok,ok?`Direct hit at ${S.a}°!`:h?`That robot was at ${h.a}°. Target: ${S.tgt}°`:`Missed at ${S.a}°. The target was ${S.tgt}°`,0)}
 else{const lx=120+540/Math.tan(S.a*Math.PI/180),ok=Math.abs(lx-S.tx)<=30;S.shot=1;S.busy=0;
  done(ok,ok?`In = out: ${S.a}° bounces off at ${S.a}°!`:lx<S.tx?'Too short! Try a smaller angle.':'Too far! Try a bigger angle.',0)}}
/* ---------- Laser Shot ---------- */
function rLaser(){S.cx=400;S.cy=420;S.rg=[0,180];S.a=90;S.blind=S.r>=9;let t,q;
 if(S.r>=7){const tt=Rn([90,180]),k=5*R(2,tt/5-2);t=tt-k;q=`${k}° + ? = ${tt}° &nbsp;so hit the ? robot`}else{t=5*R(2,34);q=`Hit the <u>${t}°</u> robot`}
 const an=[t];while(an.length<4){const c=5*R(2,34);if(an.every(x=>Math.abs(c-x)>=25))an.push(c)}
 const rs=sh([200,235,270,305]);S.bots=an.map((a,i)=>({a,r:rs[i]}));S.tgt=t;$('#q').innerHTML=q+(S.blind?' '+I('eyeoff',28):'');dockAim();draw()}
function dLaser(){const a=S.a,st=S.r<=3?15:S.r<=6?45:S.r<=8?90:180;let h=L([40,420],[760,420],'#4a6a9e',4);
 for(let t=0;t<=180;t+=st){h+=L(P(t,330),P(t,348),'#7f9cc8',3);const p=P(t,372);h+=T(p[0],p[1]+6,t+'°','#9fb3d1',18)}
 S.bots.forEach(b=>{const p=P(b.a,b.r);if(b.hl)h+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="34" fill="none" stroke="#4be08a" stroke-width="5"/>`;h+=bot(p[0],p[1],b.dead)});
 if(S.shot)h+=L([400,420],P(a,S.shot.d),'#ff3b6b',9)+L([400,420],P(a,S.shot.d),'#fff',3);else h+=L(P(a,60),P(a,345),'#ffc53377',3,'8 8');
 return h+L([400,420],P(a,85),'#ffc533',18)+`<circle cx="400" cy="420" r="30" fill="#ff7a2f"/>`}

function rBounce(){S.cx=120;S.cy=420;S.rg=[35,85];S.a=45;const th=Rn([45,50,55,60,65,70,75]);S.tx=Math.round(120+540/Math.tan(th*Math.PI/180));S.tgt=th;S.blind=S.r>=9;S.pv=S.r<=4?2:S.r<=8?1:0;$('#q').innerHTML='Bank the laser off the mirror into the robot!'+(S.blind?' '+I('eyeoff',28):'');dockAim();draw()}

 else{if(S.pv>=1)h+=L([120,420],[mx,150],'#ffc53399',4,'10 8');if(S.pv>=2)h+=L([mx,150],[lx,420],'#ffc53366',4,'10 8')}

/* ---------- Quick Fix ---------- */
function rFix(){S.cx=400;S.cy=410;const r=S.r,tt=Rn([90,180]);let ks;
 if(r>=8){const m=Math.floor(tt/10)-1;ks=[5*R(3,m),5*R(3,m)]}else if(r>=5)ks=[R(16,tt-16)];else ks=[5*R(3,tt/5-3)];
 const sm=ks.reduce((a,b)=>a+b,0),ans=tt-sm;S.q={tt,ks,sm,ans};
 const c=[sm,ans+10,ans-10,ans+5,ans-5,ans+20,ans-20],o=[...new Set(c.filter(x=>x>=5&&x<tt&&x!=ans))].slice(0,3);o.push(ans);
 $('#q').innerHTML=`${ks.join('° + ')}° + ? = ${tt}°`;$('#dock').innerHTML=sh(o).map(v=>`<button class="pri" onclick="pickFix(${v})">${v}°</button>`).join('');draw();tmr(r<=4?12:10,()=>done(false,`Time up! The answer was ${ans}°`))}
function pickFix(v){if(S.busy)return;const q=S.q;v==q.ans?done(true,`${q.sm} + ${q.ans} = ${q.tt}`,spd()):done(false,`${q.sm} + ${v} is not ${q.tt}. Answer: ${q.ans}°`)}
function dFix(){const q=S.q,cols=['#1fd1b9','#a77bff'];let c=0,h='';
 const sc=(a0,a1,col,op)=>{const p=P(a0,270),z=P(a1,270);return `<path d="M400 410L${f(p[0])} ${f(p[1])}A270 270 0 0 0 ${f(z[0])} ${f(z[1])}Z" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="3"/>`};
 q.ks.forEach((k,i)=>{h+=sc(c,c+k,cols[i],.75);const p=P(c+k/2,170);h+=T(p[0],p[1]+8,k+'°','#fff',32);c+=k});
 h+=sc(c,q.tt,'#ff7a2f',S.rev?.8:.25);const p=P(c+(q.tt-c)/2,170);h+=T(p[0],p[1]+10,S.rev?q.ans+'°':'?','#fff',44);
 h+=L([400,410],P(0,285),'#e8f0ff',6)+L([400,410],P(q.tt,285),'#e8f0ff',6)+(q.tt==90?`<path d="M400 370H440V410" fill="none" stroke="#fff" stroke-width="4"/>`:L([400,410],P(180,285),'#e8f0ff',6));
 return h+`<circle cx="400" cy="410" r="10" fill="#ffc533"/>`}

 $('#grid').innerHTML=ty.map(t=>`<button class="shp" data-t="${t}" onclick="pickShape('${t}')">${fig(t)}</button>`).join('');tmr(S.r<=5?10:8,()=>done(false,`Time up! It was the ${NAMES[S.tgt].toLowerCase()}.`))}

 t.innerHTML=`<div class="ov"><div><h2>Teacher controls</h2>${ck('live','Show live angle readout')}${ck('snd','Sound effects')}${sel('snap','Drag snaps to',[[1,'1°'],[5,'5°'],[15,'15°']])}${sel('tol','Laser Shot tolerance',[[2,'±2°'],[3,'±3°'],[5,'±5°']])}<p style="color:var(--mut)">Rounds 9–10 of the aiming games are blind rounds with no readout. Settings save on this device.</p><div class="row"><button onclick="B={};sv();tp();if(!S.m)home()">Clear best scores</button><button class="pri" onclick="tp()">Done</button></div></div></div>`}
